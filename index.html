<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- This controls the main blue clickable title link in Google search results -->
    <title>RoohithAI - Your Advanced AI Assistant</title>
    
    <!-- This controls the descriptive snippet paragraph displayed under your search link -->
    <meta name="description" content="Meet RoohithAI, a highly advanced conversational AI assistant built by Roohith and powered by Google models. Get instant help with programming, content creation, and problem solving." />
    
    <!-- Informs search engine crawlers that this site is public and ready to be ranked -->
    <meta name="robots" content="index, follow" />
    
    <!-- Displays your circular logo next to your URL in search listings and browser tabs -->
    <link rel="icon" type="image/jpeg" href="/shadow.jpg" />
    
    <!-- Open Graph Data: Renders a beautiful visual card preview when you text your site link on WhatsApp, Discord, or Messages -->
    <meta property="og:title" content="RoohithAI" />
    <meta property="og:description" content="Meet RoohithAI, your highly advanced personal AI workspace assistant." />
    <meta property="og:image" content="/shadow.jpg" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
